services:
  # Backend + Frontend (served by Spring Boot)
  - type: web
    name: parking-app
    runtime: image
    image:
      url: https://github.com/jitv-dev/parking_java_web
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: parking-db
          property: connectionString
      - key: PORT
        value: 8080

# Base de datos PostgreSQL
databases:
  - name: parking-db
    plan: free
    databaseName: parking
