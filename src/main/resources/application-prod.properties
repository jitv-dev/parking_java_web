# Puerto (Render asigna el puerto via variable PORT)
server.port=${PORT:8080}

# PostgreSQL - Render provee DATABASE_URL en formato postgresql://
# El entrypoint del Dockerfile lo convierte a formato JDBC automaticamente
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - crea/actualiza tablas desde entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desactivar consola H2 (no existe en produccion)
spring.h2.console.enabled=false
